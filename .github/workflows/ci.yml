name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Correr pruebas
        run: pytest -v

  seguridad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # historial completo para buscar secretos en todos los commits
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Secretos: Gitleaks"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "SAST: Bandit"
        run: |
          pip install bandit
          bandit -r . -x ./test_app.py -ll

      - name: "SCA: pip-audit"
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  imagen:
    needs: [pruebas, seguridad]       # la imagen solo se construye si pasan pruebas Y seguridad
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write                 # permite pedir el token OIDC a GitHub
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: lab-devops
    steps:
      - uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t app:${{ github.sha }} .

      - name: "Contenedor: Trivy"
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            app:${{ github.sha }}

      - name: "Validar configuración"
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Falta la variable AWS_ROLE_ARN en Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: "AWS: credenciales temporales por OIDC"
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "AWS: quién soy"
        if: github.event_name == 'push'
        run: aws sts get-caller-identity

      - name: "ECR: iniciar sesión"
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "ECR: etiquetar y subir"
        if: github.event_name == 'push'
        run: |
          IMAGEN="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker tag app:${{ github.sha }} "$IMAGEN"
          docker push "$IMAGEN"
          echo "Imagen publicada: $IMAGEN" >> "$GITHUB_STEP_SUMMARY"
