name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr pruebas
        run: pytest -v

  imagen:
    needs: pruebas                 # solo corre si las pruebas pasaron
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write              # permiso para publicar en GHCR
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'      # solo al llegar a main
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la imagen
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}